function genImg({titulo,sub,filas=[],sello,color='#0f766e'}){
  const W=640,c=document.createElement('canvas');const x=c.getContext('2d');
  const wrap=t=>{t=String(t??'');const out=[];let line='';t.split(' ').forEach(w=>{if((line+' '+w).trim().length>40){out.push(line.trim());line=w}else line+=' '+w});if(line.trim())out.push(line.trim());return out.length?out:['']};
  const rows=filas.map(([k,v])=>[k,wrap(v)]);
  const H=150+rows.reduce((a,[,l])=>a+30+l.length*26,0)+(sello?120:40);
  c.width=W;c.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle=color;x.fillRect(0,0,W,108);

  return c.toDataURL('image/jpeg',.82);
}

  let url=f.data;try{const b=atob(f.data.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);url=URL.createObjectURL(new Blob([a],{type:'application/pdf'}))}catch(e){}

function leerArchivo(file){return new Promise((res,rej)=>{if(!file||!file.size)return res(null);const r=new FileReader();
  if(file.type.startsWith('image/')){r.onload=()=>{const img=new Image();img.onload=()=>{const m=1100,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res({tipo:'img',nombre:file.name.replace(/\.\w+$/,'')+'.jpg',data:c.toDataURL('image/jpeg',.7)})};img.onerror=()=>rej(new Error('img'));img.src=r.result};r.onerror=rej;r.readAsDataURL(file)}
  else if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){if(file.size>900000)return res({tipo:'pdf',nombre:file.name,data:null});r.onload=()=>res({tipo:'pdf',nombre:file.name,data:r.result});r.onerror=rej;r.readAsDataURL(file)}
  else rej(new Error('tipo'))})}

function guardarCasa(e,id){e.preventDefault();const f=new FormData(e.target);const num=String(f.get('numero')).trim(),pol=String(f.get('pasaje')).trim(),fam=String(f.get('familia')).trim();

function vAdmCasa(){const c=casa(S.sub);if(!c)return empty('Casa no encontrada');const d=usuario(c.duenoId);const e=estadoCasa(c);

   <div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><div class="grow sm"><span class="muted">Código de registro</span><div class="pin" style="font-size:20px">${c.codigo}</div><span class="muted">Entregar en físico al propietario. Se renueva al aprobar.</span></div><button class="btn ghost smb" onclick="regenCodigo('${c.id}')">Renovar</button></div></div>

function regenCodigo(id){if(!confirm('¿Generar un código nuevo? El anterior dejará de funcionar.'))return;casa(id).codigo=genCodigo();save();render();toast('Código renovado')}

  const l=m.length?m:p;notificar(duenoIds(cid),m.length?'💳 Recordatorio: pagos en mora':'⏰ Recordatorio de pago',`${m.length?'Meses en mora':'Pendiente'}: ${l.map(c=>perL(c.periodo)).join(', ')}. Total ${money(sum(l,montoCuota))}. Toca para pagar.`,{tipo:'pagar',periodos:l.map(c=>c.periodo)});save();toast('Recordatorio enviado a '+casaNom(cid))}

const checksCuotas=(cid,incluirRev)=>{const l=cuotasCasa(cid).filter(c=>c.estado==='pendiente'||(incluirRev&&c.estado==='revision'));return l.length?l.map(c=>`<label class="chk"><input type="checkbox" name="per" value="${c.periodo}" checked><span class="grow">${perL(c.periodo)} ${vencida(c)?chip('Vencido','bad'):''}${c.estado==='revision'?chip('En revisión','info'):''}</span><b>${money(montoCuota(c))}</b></label>`).join(''):empty('No hay cuotas pendientes')};
const perSel=()=>[...document.querySelectorAll('#ov [name=per]:checked')].map(x=>x.value);

  sheet('Link enviado',`<p>Se notificó a <b>${esc(d?d.nombre:'')}</b> con el detalle: ${esc(conc)} · <b>${money(total)}</b>.</p>${tel?`<a class="btn sec block" target="_blank" rel="noopener" href="https://wa.me/503${tel}?text=${txt}">Enviar también por WhatsApp</a>`:''}<button class="btn ghost block" onclick="closeSheet()">Listo</button>`)}
function notifCasa(cid){sheet('Notificación a '+casaNom(cid),`<form onsubmit="notifCasaOk(event,'${cid}')"><label class="f">Título<input name="t" required></label><label class="f">Mensaje<textarea name="m" required></textarea></label><label class="f">Enviar a<select name="a"><option value="todos">Propietario e inquilinos</option><option value="dueno">Solo propietario</option></select></label><button class="btn block">Enviar</button></form>`)}

function efectivoCasa(cid){sheet('Pago en efectivo · '+casaNom(cid),`<div class="card">${checksCuotas(cid,true)}</div><label class="f">N° de recibo físico (opcional)<input id="refEf"></label><button class="btn block" onclick="efectivoOk('${cid}')">Registrar como pagado</button>`)}

  return `<h2>Más</h2>${menuItem('houses','Perfil de la residencial',"go('residencial')")}${menuItem('card','Cobro a domicilio y cierres',"go('cobros')",(()=>{const n=DB.cierres.filter(c=>c.estado==='enviado').length+DB.visitasCobro.filter(v=>v.estado==='pendiente'&&!v.cobradorId).length;return n?String(n):''})())}${menuItem('log','Accesos y bitácora',"go('accesos')")}${menuItem('flag','Reclamos y reportes',"go('reclamos')",rec?rec+' nuevo(s)':'')}${menuItem('user','Solicitudes de registro',"go('solicitudes')",sol?String(sol):'')}${menuItem('shield','Usuarios de vigilancia',"go('vigilantes')")}${menuItem('gear','Cobros y link de pago',"go('config')")}

/* Accesos / bitácora (admin y vigilancia) */
function ingresoRow({p,i}){const g=usuario(i.guardiaId);return `<div class="item"><div class="av">${TIPOS[p.tipo].e}</div><div class="grow"><b>${esc(p.nombre)}</b> <span class="muted sm">· ${casaNom(p.casaId)}</span><div class="sm muted">${TIPOS[p.tipo].l}${p.detalle?' · '+esc(p.detalle):''}</div><div class="sm">🚪 ${esc(portonNom(i.porton||p.porton))} · Entró ${fFecha(i.entrada)}${i.salida?' · salió '+hora(i.salida):''}${g?' · '+esc(g.nombre.split(' ')[0]):''}</div></div>${i.salida?chip('Salió','mut'):chip('Dentro','ok')}</div>`}
function vBitacora(){S.fAcc=S.fAcc||ymd();S.fTipo=S.fTipo||'todos';const r=[];DB.pases.forEach(p=>p.ingresos.forEach(i=>{if(i.entrada.slice(0,10)===S.fAcc&&(S.fTipo==='todos'||p.tipo===S.fTipo))r.push({p,i})}));r.sort((a,b)=>b.i.entrada.localeCompare(a.i.entrada));
  const den=DB.pases.filter(dentro);const adm=S.user.rol==='admin';
  return `<h2>${adm?'Accesos y bitácora':'Bitácora'}</h2>${adm?`<h3>Dentro de la colonia ahora (${den.length})</h3>${den.map(p=>ingresoRow({p,i:p.ingresos[p.ingresos.length-1]})).join('')||empty('Nadie dentro')}<h3>Registro por día</h3>`:''}
  <div class="two"><label class="f">Fecha<input type="date" value="${S.fAcc}" onchange="S.fAcc=this.value;render()"></label><label class="f">Tipo<select onchange="S.fTipo=this.value;render()"><option value="todos">Todos</option>${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}" ${S.fTipo===k?'selected':''}>${t.l}</option>`).join('')}</select></label></div>
  <p class="note">${r.length} ingreso(s)</p>${r.map(ingresoRow).join('')||empty('Sin ingresos en esta fecha')}
  ${adm?`<h3>Pases vigentes hoy (${DB.pases.filter(vigenteHoy).length})</h3>${DB.pases.filter(vigenteHoy).map(p=>{const e=estadoPase(p);return `<div class="item"><div class="av">${TIPOS[p.tipo].e}</div><div class="grow"><b>${esc(p.nombre)}</b> <span class="sm muted">· ${casaNom(p.casaId)}</span><div class="sm muted">${vigencia(p)}</div></div>${chip(e.l,e.c)}</div>`}).join('')}`:''}`}

/* Reclamos (admin y residente) */
function reclamoItem(r){const e=EST_R[r.estado];return `<button class="item" onclick="verReclamo('${r.id}')"><div class="grow"><b>${esc(r.titulo)}</b><div class="sm muted">${esc(r.categoria)} · ${casaNom(r.casaId)} · ${fFecha(r.fecha)}</div></div>${chip(e.l,e.c)}</button>`}
function vReclamos(){const adm=S.user.rol==='admin';S.rseg=S.rseg||'activos';
  let l=adm?DB.reclamos:DB.reclamos.filter(r=>r.casaId===S.user.casaId);
  l=l.filter(r=>S.rseg==='activos'?r.estado!=='resuelto':r.estado==='resuelto').sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `<div class="row"><h2 class="grow" style="margin:0">Reclamos y reportes</h2>${!adm?`<button class="btn smb" onclick="nuevoReclamo()">${ic('plus',16)} Reportar</button>`:''}</div>${!adm?`<p class="note">Reporta cualquier evento: daños, seguridad, ruido, basura. La administración te responde aquí.</p>`:''}${seg('rseg',[['activos','Activos'],['resueltos','Resueltos']])}${l.map(reclamoItem).join('')||empty('Sin reportes')}`}
function nuevoReclamo(){sheet('Nuevo reporte',`<form onsubmit="crearReclamo(event)"><label class="f">Categoría<select name="cat">${CATR.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="f">Título<input name="t" required></label><label class="f">Descripción<textarea name="d" required></textarea></label><label class="f">Ubicación<input name="u" placeholder="Ej. Pasaje B, frente a casa 9"></label><label class="f">Foto (opcional)<input name="foto" type="file" accept="image/*"></label><button class="btn block">Enviar reporte</button></form>`)}
async function crearReclamo(e){e.preventDefault();const f=new FormData(e.target);let foto=null;try{foto=await leerArchivo(f.get('foto'))}catch(x){return toast('Foto no válida')}
  const r={id:uid(),casaId:S.user.casaId,usuarioId:S.user.id,categoria:f.get('cat'),titulo:f.get('t'),descripcion:f.get('d'),ubicacion:f.get('u'),foto,estado:'abierto',fecha:nowISO(),hilo:[]};DB.reclamos.unshift(r);
  notificar(admins(),'📝 Nuevo reporte: '+r.titulo,`${casaNom(r.casaId)} · ${r.categoria}`,{tab:'reclamos'});save();closeSheet();render();toast('Reporte enviado')}
function verReclamo(id){const r=DB.reclamos.find(x=>x.id===id);const adm=S.user.rol==='admin';const a=usuario(r.usuarioId);
  sheet(esc(r.titulo),`<div class="kv"><span>Estado</span><b>${chip(EST_R[r.estado].l,EST_R[r.estado].c)}</b><span>Categoría</span><b>${esc(r.categoria)}</b><span>Casa</span><b>${casaNom(r.casaId)}</b><span>Reportó</span><b>${esc(a?a.nombre:'')}</b><span>Fecha</span><b>${fFecha(r.fecha)}</b>${r.ubicacion?`<span>Ubicación</span><b>${esc(r.ubicacion)}</b>`:''}</div><p style="white-space:pre-wrap">${esc(r.descripcion)}</p>${r.foto?`<img class="thumb" src="${r.foto.data}" alt="Foto del reporte">`:''}
  <h3>Seguimiento</h3>${r.hilo.map(m=>{const u=usuario(m.autor);return `<div class="thread"><b class="sm">${esc(u?u.nombre:'')}${u&&u.rol==='admin'?' · Administración':''}</b><div>${esc(m.texto)}</div><div class="muted sm">${fFecha(m.fecha)}</div></div>`}).join('')||'<p class="note">Sin respuestas aún.</p>'}
  <form onsubmit="responderReclamo(event,'${r.id}')">${adm?`<label class="f">Cambiar estado<select name="est">${Object.entries(EST_R).map(([k,v])=>`<option value="${k}" ${r.estado===k?'selected':''}>${v.l}</option>`).join('')}</select></label>`:''}<label class="f">${adm?'Respuesta al residente':'Agregar comentario'}<textarea name="t" ${adm?'':'required'}></textarea></label><button class="btn block">${adm?'Guardar y notificar':'Enviar'}</button></form>`)}
function responderReclamo(e,id){e.preventDefault();const f=new FormData(e.target);const r=DB.reclamos.find(x=>x.id===id);const t=String(f.get('t')||'').trim();const adm=S.user.rol==='admin';
  if(t)r.hilo.push({autor:S.user.id,texto:t,fecha:nowISO()});
  if(adm){const ne=f.get('est');const cambio=ne!==r.estado;r.estado=ne;if(cambio||t)notificar([r.usuarioId],'📝 Tu reporte: '+r.titulo,(cambio?'Estado: '+EST_R[ne].l+'. ':'')+t,{tab:'reclamos'})}
  else notificar(admins(),'💬 Comentario en reporte',r.titulo+': '+t,{tab:'reclamos'});
  save();closeSheet();render();toast('Guardado')}

/* Solicitudes de registro */
function vSolicitudes(){const p=DB.solicitudes.filter(s=>s.estado==='pendiente'),h=DB.solicitudes.filter(s=>s.estado!=='pendiente');
  const mini=(s,k,l)=>s[k]&&s[k].data&&s[k].tipo==='img'?`<button style="border:0;background:none;padding:0;text-align:center" onclick="verDocSol('${s.id}','${k}')"><img src="${s[k].data}" alt="${l}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)"><div class="sm muted">${l}</div></button>`:`<div class="empty sm" style="padding:10px">Sin ${l.toLowerCase()}</div>`;
  return `<h2>Solicitudes de registro</h2><p class="note">Compara el rostro de la foto en tiempo real con el DUI y la foto de perfil, revisa que cumplió el reto y que el documento de propiedad esté a su nombre.</p>${p.map(s=>{const c=casa(s.casaId);return `<div class="card"><div class="row">${avatar(s,48)}<div class="grow"><b>${esc(s.nombre)}</b><div class="sm muted">${casaNom(s.casaId)} · ${esc(c.pasaje)} · ${fFecha(s.fecha)}</div></div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${mini(s,'selfie','En vivo')}${mini(s,'duiFoto','DUI')}${mini(s,'foto','Perfil')}</div>
  ${s.selfie?`<div class="sm" style="margin-top:8px">${chip(s.selfie.metodo==='camara'?'Cámara en vivo':'Cámara del teléfono','info')} Reto: <b>${esc(s.selfie.reto)}</b> · ${fFecha(s.selfie.fecha)}</div>`:alertBox('warn','Sin foto en tiempo real','')}
  <div class="kv" style="margin-top:10px"><span>Familia</span><b>${esc(s.familia||'—')}</b><span>DUI</span><b>${esc(s.dui)}</b><span>Teléfono</span><b>${esc(s.tel)}</b><span>Correo</span><b>${esc(s.email)}</b><span>Usuario</span><b>${esc(s.user)}</b></div>${c.duenoId?alertBox('warn','La casa ya tiene propietario',`Si apruebas, ${esc(duenoNom(c.id))} y sus inquilinos quedarán desactivados.`):''}<div class="btns"><button class="btn ghost smb" onclick="verDocSol('${s.id}','documento')">Ver documento de propiedad</button></div><div class="btns"><button class="btn ok" onclick="aprobarSol('${s.id}')">Aprobar</button><button class="btn bad" onclick="rechazarSol('${s.id}')">Rechazar</button></div></div>`}).join('')||empty('No hay solicitudes pendientes')}
  ${h.length?`<h3>Historial</h3>${h.map(s=>`<div class="item">${avatar(s,40)}<div class="grow"><b>${esc(s.nombre)}</b><div class="sm muted">${casaNom(s.casaId)} · ${fFecha(s.fecha)}${s.motivo?' · '+esc(s.motivo):''}</div></div>${chip(s.estado==='aprobada'?'Aprobada':'Rechazada',s.estado==='aprobada'?'ok':'bad')}</div>`).join('')}`:''}`}
function verDocSol(id,k){const s=DB.solicitudes.find(x=>x.id===id);verArchivo(s[k],{documento:'Documento de propiedad',duiFoto:'DUI',foto:'Foto de perfil',selfie:'Foto en tiempo real'}[k])}
function aprobarSol(id){const s=DB.solicitudes.find(x=>x.id===id);const c=casa(s.casaId);if(DB.usuarios.some(u=>u.user.toLowerCase()===s.user.toLowerCase()))return toast('El usuario ya existe; rechaza y pide otro');
  if(c.duenoId&&!confirm('La casa ya tiene propietario. ¿Reemplazarlo?'))return;
  if(c.duenoId)DB.usuarios.forEach(u=>{if(u.id===c.duenoId||(u.rol==='inquilino'&&u.padreId===c.duenoId))u.activo=false});
  const u={id:'u_'+uid(),rol:'residente',nombre:s.nombre,user:s.user,pass:s.pass,casaId:c.id,tel:s.tel,email:s.email,dui:s.dui,foto:s.foto||null,activo:true};DB.usuarios.push(u);c.duenoId=u.id;if(s.familia)c.familia=s.familia;c.codigo=genCodigo();s.estado='aprobada';
  notificar([u.id],'🎉 Cuenta aprobada','Bienvenido(a). Ya puedes gestionar accesos, pagos y reportes de tu casa.');save();render();toast('Propietario aprobado. Ya puede ingresar con su usuario')}
function rechazarSol(id){const m=prompt('Motivo del rechazo:','Documento no coincide con el propietario');if(m===null)return;const s=DB.solicitudes.find(x=>x.id===id);s.estado='rechazada';s.motivo=m;s.pass='';save();render();toast('Solicitud rechazada')}

/* Vigilantes */
function vVigilantes(){const l=DB.usuarios.filter(u=>u.rol==='vigilante');return `<div class="row" style="margin-bottom:12px"><h2 class="grow" style="margin:0">Vigilancia</h2><button class="btn smb" onclick="nuevoVig()">${ic('plus',16)} Vigilante</button></div><p class="note">Los vigilantes ven los pases de acceso, validan a la persona y marcan su ingreso y salida. El residente recibe el aviso al instante.</p>${l.map(u=>`<div class="item"><div class="av">${ic('shield',20)}</div><div class="grow"><b>${esc(u.nombre)}</b><div class="sm muted">Usuario: ${esc(u.user)} · ${esc(u.turno||'')}</div></div><button class="btn smb ${u.activo?'ghost':'sec'}" onclick="toggleUser('${u.id}')">${u.activo?'Desactivar':'Activar'}</button></div>`).join('')||empty('Sin vigilantes')}`}
function nuevoVig(){sheet('Nuevo vigilante',`<form onsubmit="crearUsuario(event,'vigilante')"><label class="f">Nombre<input name="nombre" required></label><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off"></label><label class="f">Turno<select name="turno"><option>Día (6:00–18:00)</option><option>Noche (18:00–6:00)</option><option>24 horas</option></select></label><div class="two"><label class="f">Usuario<input name="user" required autocapitalize="none"></label><label class="f">Contraseña<input name="pass" required minlength="4"></label></div><button class="btn block">Crear usuario</button></form>`)}
function crearUsuario(e,rol){e.preventDefault();const f=new FormData(e.target);if(!duiOk(String(f.get('dui')||'').trim()))return toast('DUI incompleto. Formato: 00000000-0');const un=String(f.get('user')).trim().toLowerCase();if(DB.usuarios.some(u=>u.user.toLowerCase()===un))return toast('Ese usuario ya existe');
  const u={id:'u_'+uid(),rol,nombre:f.get('nombre'),user:un,pass:f.get('pass'),dui:f.get('dui')||'',tel:f.get('tel')||'',activo:true};
  if(rol==='vigilante')u.turno=f.get('turno');if(rol==='admin')u.cargo=f.get('cargo');
  if(rol==='inquilino'){u.casaId=S.user.casaId;u.padreId=S.user.id;u.hasta=f.get('hasta');if(u.hasta<ymd())return toast('La fecha de vigencia ya pasó')}
  DB.usuarios.push(u);save();closeSheet();render();toast('Usuario creado: '+un)}
function toggleUser(id){const u=usuario(id);u.activo=!u.activo;save();render()}

/* Perfil de la residencial */
function vResidencial(){S.rtab=S.rtab||'general';return `<h2>Perfil de la residencial</h2>${seg('rtab',[['general','Datos generales'],['equipo','Directiva y personal'],['portones','Portones']])}${S.rtab==='equipo'?resEquipo():S.rtab==='portones'?resPortones():resGeneral()}`}
function resGeneral(){const r=DB.residencial;const fld=(k,l,v,t='text')=>`<label class="f">${l}<input name="${k}" type="${t}" value="${esc(v||'')}"></label>`;const pr=miembro('Presidente'),ad=miembro('Administrador(a)');
  return `<div class="card"><div class="kv"><span>Casas</span><b>${DB.casas.length} (${DB.casas.filter(c=>c.duenoId).length} con propietario)</b><span>Polígonos</span><b>${[...new Set(DB.casas.map(c=>c.pasaje))].length}</b><span>Portones</span><b>${portones().length}</b><span>Presidente</span><b>${esc(pr?pr.nombre:'Sin asignar')}</b><span>Administración</span><b>${esc(ad?ad.nombre:'Sin asignar')}</b><span>Vigilantes</span><b>${DB.usuarios.filter(u=>u.rol==='vigilante'&&u.activo).length}</b></div></div>
  <form onsubmit="guardarResidencial(event)"><h3>Datos generales</h3><div class="card">${fld('r.nombre','Nombre de la residencial',r.nombre)}${fld('r.direccion','Dirección',r.direccion)}${fld('r.municipio','Municipio / departamento',r.municipio)}${fld('r.registro','N° de registro / NIT de la asociación',r.registro)}<div class="two">${fld('r.telefono','Teléfono',r.telefono,'tel')}${fld('r.email','Correo',r.email,'email')}</div>${fld('v.telefono','Teléfono de portería',r.vigilancia.telefono,'tel')}</div>
  <h3>Cuenta para transferencias</h3><div class="card">${fld('b.banco','Banco',r.banco.banco)}${fld('b.tipo','Tipo de cuenta',r.banco.tipo)}${fld('b.numero','Número de cuenta',r.banco.numero)}${fld('b.titular','Titular',r.banco.titular)}</div>
  <button class="btn block">Guardar datos generales</button></form>`}
function guardarResidencial(e){e.preventDefault();const r=DB.residencial;const map={r,b:r.banco,v:r.vigilancia};new FormData(e.target).forEach((v,k)=>{const[o,f]=k.split('.');map[o][f]=v});save();{const pr=PLAT.residenciales.find(x=>x.id===RES);if(pr){pr.nombre=r.nombre;pr.municipio=r.municipio;savePlat()}}render();toast('Datos guardados')}
function resEquipo(){const eq=DB.residencial.equipo||(DB.residencial.equipo=[]);const vig=DB.usuarios.filter(u=>u.rol==='vigilante');
  const item=m=>`<button class="item" onclick="editarMiembro('${m.id}')"><div class="av" style="border-radius:50%">${esc(m.nombre.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div class="grow"><b>${esc(m.nombre)}</b><div class="sm muted">${esc(m.telefono||'Sin teléfono')}${m.email?' · '+esc(m.email):''}</div></div>${chip(esc(m.cargo),grupoDe(m.cargo)==='directiva'?'info':'')}</button>`;
  const orden=(a,b)=>{const L=Object.values(CARGOS).flat();return L.indexOf(a.cargo)-L.indexOf(b.cargo)};
  const adms=DB.usuarios.filter(u=>u.rol==='admin');
  return `<h3 style="margin-top:4px">Usuarios con acceso de administración</h3>${adms.map(u=>`<div class="item"><div class="av" style="border-radius:50%">${ic('gear',18)}</div><div class="grow"><b>${esc(u.nombre)}</b><div class="sm muted">${esc(u.cargo||'Administración')} · usuario ${esc(u.user)}</div></div>${u.id===S.user.id?chip('Tú','info'):`<button class="btn smb ${u.activo?'ghost':'sec'}" onclick="toggleUser('${u.id}')">${u.activo?'Desactivar':'Activar'}</button>`}</div>`).join('')}<button class="btn sec block" onclick="nuevoAdminUser()">${ic('plus',18)} Agregar usuario de administración</button>
  <h3>Integrantes</h3><button class="btn block" onclick="editarMiembro()">${ic('plus',18)} Agregar integrante</button>${Object.keys(GRUPO).map(g=>`<h3>${GRUPO[g]}</h3>${eq.filter(m=>grupoDe(m.cargo)===g).sort(orden).map(item).join('')||empty('Sin integrantes')}`).join('')}
  <h3>Cobradores</h3>${DB.usuarios.filter(u=>u.rol==='cobrador').map(u=>`<div class="item"><div class="av" style="border-radius:50%">${ic('card',18)}</div><div class="grow"><b>${esc(u.nombre)}</b><div class="sm muted">${esc(u.tel||'')} · usuario ${esc(u.user)}</div></div><button class="btn smb ${u.activo?'ghost':'sec'}" onclick="toggleUser('${u.id}')">${u.activo?'Desactivar':'Activar'}</button></div>`).join('')||empty('Sin cobradores')}<button class="btn sec block" onclick="nuevoCob()">${ic('plus',18)} Agregar cobrador</button>
  <h3>Vigilancia</h3>${vig.map(u=>`<div class="item"><div class="av" style="border-radius:50%">${ic('shield',18)}</div><div class="grow"><b>${esc(u.nombre)}</b><div class="sm muted">${esc(u.turno||'')} · usuario ${esc(u.user)}</div></div>${chip(u.activo?'Activo':'Inactivo',u.activo?'ok':'mut')}</div>`).join('')||empty('Sin vigilantes')}<button class="btn sec block" onclick="nuevoVig()">${ic('plus',18)} Agregar vigilante</button>`}
function editarMiembro(id){const m=id?(DB.residencial.equipo||[]).find(x=>x.id===id):{};const f=(k,l,t='text')=>`<label class="f">${l}<input name="${k}" type="${t}" value="${esc(m[k]||'')}" ${k==='nombre'?'required':''}${k==='dui'?' inputmode="numeric" maxlength="10" autocomplete="off" placeholder="00000000-0"':''}></label>`;
  sheet(id?'Editar integrante':'Nuevo integrante',`<form onsubmit="guardarMiembro(event,'${id||''}')"><label class="f">Cargo<select name="cargo">${Object.keys(CARGOS).map(g=>`<optgroup label="${GRUPO[g]}">${CARGOS[g].map(c=>`<option ${m.cargo===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}</select></label>${f('nombre','Nombre completo')}${f('dui','DUI')}<div class="two">${f('telefono','Teléfono','tel')}${f('email','Correo','email')}</div><button class="btn block">Guardar</button>${id?`<button type="button" class="btn bad block" onclick="borrarMiembro('${id}')">Quitar de la lista</button>`:''}</form>`)}
function guardarMiembro(e,id){e.preventDefault();const f=new FormData(e.target);const o={cargo:f.get('cargo'),nombre:String(f.get('nombre')).trim(),dui:String(f.get('dui')).trim(),telefono:f.get('telefono'),email:f.get('email')};if(!duiOk(o.dui))return toast('DUI incompleto. Formato: 00000000-0');
  const eq=DB.residencial.equipo;if(['Presidente','Vicepresidente','Secretario(a)','Tesorero(a)','Síndico'].includes(o.cargo)&&eq.some(m=>m.cargo===o.cargo&&m.id!==id))return toast('Ya hay un '+o.cargo.toLowerCase()+'. Edítalo o quítalo primero');
  if(id)Object.assign(eq.find(m=>m.id===id),o);else eq.push(Object.assign({id:'e'+uid()},o));save();closeSheet();render();toast('Integrante guardado')}
function borrarMiembro(id){DB.residencial.equipo=DB.residencial.equipo.filter(m=>m.id!==id);save();closeSheet();render();toast('Integrante quitado')}
function resPortones(){const ps=portones();return `<div class="card row"><div class="av">${ic('doorin',20)}</div><div class="grow"><span class="muted sm">Accesos a la residencial</span><div style="font-size:22px;font-weight:800">${ps.length} portón${ps.length===1?'':'es'}</div></div><button class="btn smb" onclick="editarPorton()">${ic('plus',16)} Portón</button></div>

  <h3>Por dónde ingresa cada tipo de acceso</h3><div class="card">${Object.entries(TIPOS).map(([k,t])=>`<label class="f">${t.e} ${t.l}<select onchange="DB.residencial.portonTipo['${k}']=this.value;save();toast('Guardado')">${ps.map(p=>`<option value="${p.id}" ${portonDe(k)===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label>`).join('')}<p class="note" style="margin:0">Cada pase nuevo indica por cuál portón debe entrar la persona. Vigilancia lo ve al validar.</p></div>`}
function editarPorton(id){const p=id?portones().find(x=>x.id===id):{};sheet(id?'Editar portón':'Nuevo portón',`<form onsubmit="guardarPorton(event,'${id||''}')"><label class="f">Nombre<input name="nombre" required value="${esc(p.nombre||'')}" placeholder="Ej. Portón norte"></label><label class="f">Tipo de acceso<select name="tipo">${['Vehicular y peatonal','Vehicular','Peatonal'].map(t=>`<option ${p.tipo===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="f">Horario<input name="horario" value="${esc(p.horario||'')}" placeholder="Ej. 24 horas"></label><button class="btn block">Guardar</button>${id&&portones().length>1?`<button type="button" class="btn bad block" onclick="borrarPorton('${id}')">Eliminar portón</button>`:''}</form>`)}
function guardarPorton(e,id){e.preventDefault();const f=new FormData(e.target);const o={nombre:String(f.get('nombre')).trim(),tipo:f.get('tipo'),horario:f.get('horario')};const r=DB.residencial;r.portones=r.portones||[];r.portonTipo=r.portonTipo||{};

function borrarPorton(id){const r=DB.residencial;r.portones=r.portones.filter(p=>p.id!==id);Object.keys(r.portonTipo).forEach(k=>{if(r.portonTipo[k]===id)r.portonTipo[k]=r.portones[0].id});save();closeSheet();render();toast('Portón eliminado')}
function vConfig(){const c=DB.config;return `<h2>Cobros y link de pago</h2><form onsubmit="guardarConfig(event)"><div class="card"><div class="two"><label class="f">Cuota mensual ($)<input name="cuota" type="number" step="0.01" min="0" value="${c.cuota}"></label><label class="f">Día de vencimiento<input name="diaVence" type="number" min="1" max="28" value="${c.diaVence}"></label></div><div class="two"><label class="f">Recargo por mes vencido ($)<input name="recargo" type="number" step="0.01" min="0" value="${c.recargo}"></label><label class="f">Recordar X días antes<input name="diasAviso" type="number" min="0" max="20" value="${c.diasAviso}"></label></div><p class="note">La nueva cuota aplica a los meses que se generen a partir de ahora.</p></div>
  <h3>Pasarela de pago</h3><div class="card"><label class="f">URL del link de pago<input name="linkPago" type="url" placeholder="https://..." value="${esc(c.linkPago)}"></label><p class="note">Cuando elijas pasarela (Wompi, N1co u otra), pega aquí el link. La app le agrega monto, referencia y concepto (mes y casa). Si está vacío, la demo simula el pago.</p></div><button class="btn block">Guardar</button></form>`}
function guardarConfig(e){e.preventDefault();const f=new FormData(e.target);const c=DB.config;c.cuota=+f.get('cuota');c.diaVence=Math.min(28,Math.max(1,+f.get('diaVence')));c.recargo=+f.get('recargo');c.diasAviso=+f.get('diasAviso');c.linkPago=String(f.get('linkPago')||'').trim();

function autCard(a){return `<div class="card" style="border:2px solid var(--warn)"><div class="row"><div class="av">${TIPOS[a.tipo].e}</div><div class="grow"><b>${esc(a.nombre)}</b><div class="sm muted">${TIPOS[a.tipo].l}${a.motivo?' · '+esc(a.motivo):''}</div><div class="sm">Vigilancia pide autorización · ${hora(a.fecha)}</div></div></div><div class="btns"><button class="btn ok" onclick="responderAut('${a.id}',true)">Autorizar ingreso</button><button class="btn bad" onclick="responderAut('${a.id}',false)">Rechazar</button></div></div>`}
function responderAut(id,ok){const a=DB.autorizaciones.find(x=>x.id===id);if(a.estado!=='esperando')return toast('Ya fue respondida');a.estado=ok?'aprobado':'rechazado';a.respondidoPor=S.user.id;a.fechaResp=nowISO();
  if(ok){const p={id:uid(),casaId:a.casaId,creadoPor:S.user.id,tipo:a.tipo,porton:a.porton||portonDe(a.tipo),nombre:a.nombre,dui:a.dui,detalle:a.motivo,placa:a.placa,horario:'',desde:ymd(),hasta:ymd(),pin:genPin(),estado:'activo',ingresos:[]};DB.pases.push(p);a.paseId=p.id}
  notificar(vigilantes(),ok?'✅ Ingreso autorizado':'⛔ Ingreso rechazado',`${a.nombre} · ${casaNom(a.casaId)} · respondió ${S.user.nombre}`,{tab:'inicio'});save();render();toast(ok?'Ingreso autorizado':'Ingreso rechazado')}
function vResInicio(){const u=S.user,cid=u.casaId;const aut=DB.autorizaciones.filter(a=>a.casaId===cid&&a.estado==='esperando');
  const hoyP=DB.pases.filter(p=>p.casaId===cid&&(vigenteHoy(p)||dentro(p)));
  let h=`<h2>Hola, ${esc(u.nombre.split(' ')[0])} 👋</h2>`;
  h+=aut.map(autCard).join('');

    if(m.length)h+=alertBox('bad',`Tienes ${m.length} mes(es) en mora · ${money(sum(m,montoCuota))}`,m.map(c=>perL(c.periodo)).join(', ')+'. Toca para pagar.',"S.sel=null;go('pagos')");
    else if(p.length)h+=alertBox('warn','Cuota del mes pendiente',`Vence el ${fFecha(vence(periodoActual()))}. Toca para pagar.`,"go('pagos')");
    else if(cuotasCasa(cid).some(q=>q.estado==='revision'))h+=alertBox('info','Pago en revisión','La administración está validando tu comprobante.',"go('pagos')");
    else h+=alertBox('ok','Estás al día ✓','Gracias por mantener tus pagos al día.')}
  h+=`<div class="tipos">${Object.entries(TIPOS).map(([k,t])=>`<button onclick="nuevoPase('${k}')"><span style="font-size:24px">${t.e}</span>${t.l}</button>`).join('')}</div>`;
  h+=`<h3>Accesos de hoy</h3>${hoyP.map(paseItem).join('')||empty('Sin pases para hoy')}`;
  const av=DB.avisos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,2);
  h+=`<h3>Últimos avisos</h3>${av.map(a=>avisoCard(a,false)).join('')||empty('Sin avisos')}`;
  return h}
function paseItem(p){const e=estadoPase(p);return `<button class="item" onclick="verPase('${p.id}')"><div class="av">${TIPOS[p.tipo].e}</div><div class="grow"><b>${esc(p.nombre)}</b><div class="sm muted">${TIPOS[p.tipo].l}${p.detalle?' · '+esc(p.detalle):''}</div><div class="sm">🚪 ${esc(portonNom(p.porton))}</div></div>${chip(e.l,e.c)}</button>`}
function vAccesos(){const cid=S.user.casaId;S.aseg=S.aseg||'activos';const h=ymd();const ps=DB.pases.filter(p=>p.casaId===cid);
  const act=ps.filter(p=>dentro(p)||(p.estado==='activo'&&p.hasta>=h));const hist=ps.filter(p=>!act.includes(p));const l=(S.aseg==='activos'?act:hist).slice().sort((a,b)=>b.desde.localeCompare(a.desde));
  return `<h2>Control de acceso</h2><p class="note" style="margin-top:-6px">Crea un pase y comparte el PIN. Vigilancia lo valida al llegar y te avisa cuando la persona ingresa.</p><div class="tipos">${Object.entries(TIPOS).map(([k,t])=>`<button onclick="nuevoPase('${k}')"><span style="font-size:24px">${t.e}</span>${t.l}</button>`).join('')}</div>${seg('aseg',[['activos',`Activos (${act.length})`],['historial','Historial']])}${l.map(paseItem).join('')||empty('Sin pases')}`}
function nuevoPase(tipo){const t=TIPOS[tipo],h=ymd();let f='';
  if(tipo==='personal')f=`<label class="f">Nombre completo<input name="nombre" required></label><div class="two"><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="00000000-0"></label><label class="f">Oficio<select name="detalle">${OFICIOS.map(o=>`<option>${o}</option>`).join('')}</select></label></div><div class="two"><label class="f">Desde<input name="desde" type="date" value="${h}" required></label><label class="f">Hasta<input name="hasta" type="date" value="${addDays(h,6)}" required></label></div><label class="f">Horario (opcional)<input name="horario" placeholder="Lun–Sáb 7:00–16:00"></label><label class="f">Placa (opcional)<input name="placa"></label>`;
  if(tipo==='entrega')f=`<label class="f">Servicio / restaurante<input name="detalle" required placeholder="Ej. Pedido de pizza"></label><label class="f">Nombre del repartidor (si lo sabes)<input name="nombre" placeholder="Repartidor"></label><label class="f">Fecha<input name="desde" type="date" value="${h}" required></label>`;
  if(tipo==='correo')f=`<label class="f">Empresa de paquetería<input name="nombre" required placeholder="Ej. Courier"></label><label class="f">Detalle del paquete<input name="detalle" placeholder="Ej. Caja mediana a nombre de..."></label><div class="two"><label class="f">Desde<input name="desde" type="date" value="${h}" required></label><label class="f">Hasta<input name="hasta" type="date" value="${addDays(h,2)}" required></label></div>`;
  if(tipo==='visita')f=`<label class="f">Nombre del visitante<input name="nombre" required></label><div class="two"><label class="f">DUI (opcional)<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off"></label><label class="f">Placa (opcional)<input name="placa"></label></div><div class="two"><label class="f">Desde<input name="desde" type="date" value="${h}" required></label><label class="f">Hasta<input name="hasta" type="date" value="${h}" required></label></div><label class="f">Motivo (opcional)<input name="detalle"></label>`;
  sheet(t.e+' '+t.l,`<form onsubmit="crearPase(event,'${tipo}')">${f}<div class="alert info"><b>🚪 Ingresará por: ${esc(portonNom(portonDe(tipo)))}</b><p>Definido por la administración para este tipo de acceso.</p></div>${S.user.rol==='inquilino'?`<p class="note">Tu acceso como inquilino vence el ${fFecha(S.user.hasta)}; el pase no puede pasar de esa fecha.</p>`:''}<button class="btn block">Crear pase</button></form>`)}
function crearPase(e,tipo){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();
  const p={id:uid(),casaId:S.user.casaId,creadoPor:S.user.id,tipo,nombre:g('nombre')||(tipo==='entrega'?'Repartidor':''),dui:g('dui'),detalle:g('detalle'),placa:g('placa'),horario:g('horario'),desde:g('desde'),hasta:g('hasta')||g('desde'),pin:genPin(),porton:portonDe(tipo),estado:'activo',ingresos:[]};
  if(!duiOk(p.dui))return toast('DUI incompleto. Formato: 00000000-0');if(p.hasta<p.desde)return toast('La fecha final es anterior a la inicial');if(p.hasta<ymd())return toast('El pase ya estaría vencido');
  if(S.user.rol==='inquilino'&&p.hasta>S.user.hasta)return toast('No puede pasar de tu fecha de vigencia');
  DB.pases.push(p);save();render();verPase(p.id,true)}
function textoPase(p){return `Pase de acceso · ${DB.residencial.nombre}\n${casaNom(p.casaId)}\n${TIPOS[p.tipo].l}: ${p.nombre}\nVálido: ${vigencia(p)}${p.horario?' ('+p.horario+')':''}\nPIN: ${p.pin}\nPresenta tu DUI en portería.`}
function verPase(id,nuevo){const p=DB.pases.find(x=>x.id===id);const e=estadoPase(p);const cr=usuario(p.creadoPor);const act=p.estado==='activo'&&p.hasta>=ymd();
  sheet(TIPOS[p.tipo].e+' '+esc(p.nombre),`${nuevo?alertBox('ok','Pase creado','Compártelo con la persona. Vigilancia lo verá en portería.'):''}<div class="card" style="text-align:center"><div class="muted sm">PIN de acceso</div><div class="pin" style="font-size:34px">${p.pin}</div>${chip(e.l,e.c)}</div>
  <div class="kv"><span>Tipo</span><b>${TIPOS[p.tipo].l}</b>${p.detalle?`<span>Detalle</span><b>${esc(p.detalle)}</b>`:''}${p.dui?`<span>DUI</span><b>${esc(p.dui)}</b>`:''}${p.placa?`<span>Placa</span><b>${esc(p.placa)}</b>`:''}<span>Ingresa por</span><b>🚪 ${esc(portonNom(p.porton))}</b><span>Vigencia</span><b>${vigencia(p)}</b>${p.horario?`<span>Horario</span><b>${esc(p.horario)}</b>`:''}<span>Creado por</span><b>${esc(cr?cr.nombre:'')}</b></div>
  ${p.ingresos.length?`<h3>Ingresos</h3>${p.ingresos.slice().reverse().slice(0,10).map(i=>`<div class="chk"><span class="grow">${fFecha(i.entrada)}</span><span class="sm muted">${i.salida?'salió '+hora(i.salida):'dentro'}</span></div>`).join('')}`:''}
  <div class="btns">${act?`<button class="btn" onclick="compartirPase('${p.id}')">${ic('share',18)} Compartir</button><button class="btn bad" onclick="cancelarPase('${p.id}')">Cancelar pase</button>`:''}</div>`)}
async function compartirPase(id){const p=DB.pases.find(x=>x.id===id);const t=textoPase(p);try{if(navigator.share){await navigator.share({text:t});return}}catch(e){return}try{await navigator.clipboard.writeText(t);toast('Copiado: pégalo en WhatsApp')}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}}
function cancelarPase(id){if(!confirm('¿Cancelar este pase? El PIN dejará de funcionar.'))return;const p=DB.pases.find(x=>x.id===id);p.estado='cancelado';save();closeSheet();render();toast('Pase cancelado')}

function vResPagos(){const cid=S.user.casaId;const cs=cuotasCasa(cid);const pend=cs.filter(c=>c.estado==='pendiente');
  if(!S.sel)S.sel=pend.map(c=>c.periodo);S.sel=S.sel.filter(p=>pend.some(c=>c.periodo===p));
  const sel=pend.filter(c=>S.sel.includes(c.periodo));const total=sum(sel,montoCuota);const m=moraCasa(cid);const b=DB.residencial.banco;
  let h=`<h2>Mis pagos</h2>`;
  if(m.length)h+=alertBox('bad',`En mora: ${m.length} mes(es) · ${money(sum(m,montoCuota))}`,`${m.map(c=>perL(c.periodo)).join(', ')}. Incluye recargo de ${money(DB.config.recargo)} por mes vencido.`);
  else if(pend.length)h+=alertBox('warn','Cuota pendiente',`Vence el ${fFecha(vence(periodoActual()))}.`);
  else h+=alertBox('ok','Estás al día ✓','');
  h+=`<h3>Selecciona los meses a pagar</h3><div class="card">${cs.slice().reverse().slice(0,12).map(c=>{if(c.estado==='pendiente')return `<label class="chk"><input type="checkbox" ${S.sel.includes(c.periodo)?'checked':''} onchange="toggleSel('${c.periodo}')"><span class="grow">${perL(c.periodo)} ${vencida(c)?chip('Vencido','bad'):chip('Pendiente','warn')}</span><b>${money(montoCuota(c))}</b></label>`;
    const st=c.estado==='pagado'?['Pagado','ok']:['En revisión','info'];return `<div class="chk"><span style="width:22px;text-align:center">${c.estado==='pagado'?'✓':'⏳'}</span><span class="grow muted">${perL(c.periodo)} ${chip(st[0],st[1])}</span><b class="muted">${money(c.monto)}</b></div>`}).join('')}</div>`;
  if(pend.length)h+=`<div class="card"><div class="row"><span class="grow">Total seleccionado (${sel.length} mes${sel.length===1?'':'es'})</span><b style="font-size:21px">${money(total)}</b></div><div class="btns"><button class="btn" onclick="pagarLink()">Pagar en línea</button><button class="btn sec" onclick="pagarTransf()">Ya transferí · adjuntar</button></div><button class="btn ghost block" onclick="pedirCobro('${cid}')">🧾 Que el cobrador pase a mi casa</button></div>`;
  h+=visitaRes(cid);
  h+=`<h3>Cuenta para transferencias</h3><div class="card kv"><span>Banco</span><b>${esc(b.banco)}</b><span>Tipo</span><b>${esc(b.tipo)}</b><span>Número</span><b>${esc(b.numero)}</b><span>Titular</span><b>${esc(b.titular)}</b><span>Concepto</span><b>${casaNom(cid)} + mes(es)</b></div>`;
  const ps=DB.pagos.filter(p=>p.casaId===cid).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  h+=`<h3>Historial de pagos</h3>${ps.map(p=>pagoCard(p,false)).join('')||empty('Sin pagos registrados')}`;return h}
function toggleSel(p){S.sel=S.sel.includes(p)?S.sel.filter(x=>x!==p):[...S.sel,p];render()}
function selCuotas(){return pendCasa(S.user.casaId).filter(c=>S.sel&&S.sel.includes(c.periodo))}
function detalleCobro(cs){const conc='Cuota de mantenimiento: '+cs.map(c=>perL(c.periodo)).join(', ');return{conc,total:sum(cs,montoCuota)}}
function pagarLink(){const cs=selCuotas();if(!cs.length)return toast('Selecciona al menos un mes');const c=casa(S.user.casaId);const{conc,total}=detalleCobro(cs);const ref='RES'+c.numero+'-'+String(Date.now()).slice(-6);
  S.link={periodos:cs.map(x=>x.periodo),total,ref,conc};
  sheet('Link de pago',`<div class="card" style="border:2px solid var(--pri)"><div class="muted sm" style="margin-bottom:8px">Detalle del cobro</div><div class="kv"><span>Residencial</span><b>${esc(DB.residencial.nombre)}</b><span>Casa</span><b>${casaNom(c.id)} · ${esc(c.pasaje)}</b><span>Concepto</span><b>${esc(conc)}</b><span>Monto</span><b style="font-size:19px">${money(total)}</b><span>Referencia</span><b>${ref}</b></div></div>
  <ol class="note" style="padding-left:18px"><li>Toca <b>Ir a pagar</b> y completa el pago en la pasarela.</li><li>Regresa y toca <b>Ya pagué</b>: la app genera la captura con este detalle y la adjunta al mes correspondiente.</li></ol>
  <button class="btn block" onclick="abrirLink()">Ir a pagar</button><button class="btn sec block" onclick="confirmarLink()">Ya pagué · adjuntar captura</button>`)}
function abrirLink(){const l=DB.config.linkPago,L=S.link;if(!l)return toast('Demo: aún no hay pasarela configurada. Toca “Ya pagué” para simular.');
  try{const u=new URL(l);u.searchParams.set('monto',L.total.toFixed(2));u.searchParams.set('referencia',L.ref);u.searchParams.set('concepto',L.conc+' · '+casaNom(S.user.casaId));window.open(u.toString(),'_blank')}catch(e){window.open(l,'_blank')}}
function confirmarLink(){const L=S.link,cid=S.user.casaId;if(!L)return;
  const img=genImg({titulo:'Pago en línea',sub:DB.residencial.nombre,filas:[['Casa',casaNom(cid)+' · '+duenoNom(cid)],['Concepto',L.conc],['Monto',money(L.total)],['Referencia',L.ref],['Fecha',fFecha(nowISO())]],sello:'PAGADO',color:'#1e3a8a'});
  registrarPago({casaId:cid,periodos:L.periodos,monto:L.total,metodo:'link',ref:L.ref,comprobante:{tipo:'img',nombre:'captura-'+L.ref+'.jpg',data:img}});S.link=null;

function pagarTransf(){const cs=selCuotas();if(!cs.length)return toast('Selecciona al menos un mes');const{conc,total}=detalleCobro(cs);

function buscarVig(q){q=q.trim().toLowerCase();if(!q)return'';const l=DB.pases.filter(p=>(vigenteHoy(p)||dentro(p))&&(p.pin===q||p.nombre.toLowerCase().includes(q)||('casa '+casa(p.casaId).numero)===q||casa(p.casaId).numero===q));

  return l.map(paseItemVig).join('')+(inv.length?alertBox('bad','PIN no válido hoy',`Pase ${estadoPase(inv[0]).l.toLowerCase()} · ${casaNom(inv[0].casaId)}. No permitir el ingreso; usa “Sin pase” para pedir autorización.`):'')+(!l.length&&!inv.length?empty('Sin coincidencias. Usa “Sin pase” para pedir autorización al residente.'):'')}

  ${S.gate&&S.gate!=='todos'&&p.porton&&p.porton!==S.gate&&!d?alertBox('warn','Portón diferente','Este acceso está asignado a '+esc(portonNom(p.porton))+'. Indícale a la persona por dónde debe entrar o confirma con el residente.'):''}${!d&&ok?`<p class="note">✔ Pide el DUI y verifica que el nombre${p.dui?' y número':''} coincidan antes de marcar el ingreso.</p><button class="btn ok block big-ok" onclick="marcarIngreso('${p.id}')">${ic('check',20)} La persona ingresó a la colonia</button>`:''}

  ${!d&&!ok?alertBox('bad','Pase no vigente hoy','No permitir el ingreso sin autorización del residente.'):''}`)}

function guardarRes(e,id){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();const r=PLAT.residenciales.find(x=>x.id===id);const d=leerDB(id);
  const ad=d.usuarios.find(u=>u.rol==='admin');const un=g('adminUser').toLowerCase();if(d.usuarios.some(u=>u!==ad&&u.user.toLowerCase()===un))return toast('Ese usuario ya lo usa otra persona de la residencial');
  // casas
  const n=Math.max(1,+g('casas')),cur=d.casas.length;let msgC='';
  if(n>cur){const pol=normPol(g('polNuevo'))||'Polígono A';let max=Math.max(0,...d.casas.filter(c=>c.pasaje.toLowerCase()===pol.toLowerCase()).map(c=>parseInt(c.numero)||0));const per=periodoActual();const desde=ymd()<=per+'-'+pad(d.config.diaVence)?per:addMonths(per,1);
    for(let k=0;k<n-cur;k++)d.casas.push({id:'c'+uid(),numero:String(++max),pasaje:pol,familia:'',duenoId:null,codigo:genCodigo(),desde});msgC=` · ${n-cur} casa(s) nuevas en ${pol}`}
  if(n<cur){const libres=d.casas.filter(c=>!c.duenoId&&!d.pagos.some(p=>p.casaId===c.id)).reverse();if(libres.length<cur-n)return toast(`Solo se pueden quitar ${libres.length} casa(s): las demás tienen propietario o pagos`);
    const fuera=new Set(libres.slice(0,cur-n).map(c=>c.id));d.casas=d.casas.filter(c=>!fuera.has(c.id));d.cuotas=d.cuotas.filter(q=>!fuera.has(q.casaId));msgC=` · ${cur-n} casa(s) quitadas`}
  // cuota
  d.config.cuota=+g('cuota');d.config.diaVence=Math.min(28,Math.max(1,+g('diaVence')||10));const per=periodoActual();d.cuotas.forEach(q=>{if(q.periodo>per&&q.estado==='pendiente')q.monto=d.config.cuota});
  // admin
  if(ad){ad.nombre=g('adminNombre')||ad.nombre;ad.user=un;ad.tel=g('ct');if(g('adminPass'))ad.pass=g('adminPass')}
  const eq=(d.residencial.equipo||[]).find(m=>m.cargo==='Administrador(a)');if(eq){eq.nombre=g('adminNombre')||eq.nombre;eq.telefono=g('ct');eq.email=g('ce')}
  d.residencial.nombre=g('nombre');d.residencial.municipio=g('municipio');d.residencial.direccion=g('direccion');
  r.nombre=g('nombre');r.municipio=g('municipio');r.contacto={nombre:g('adminNombre'),tel:g('ct'),email:g('ce')};r.plan=g('plan');r.estado=g('estado');r.vencePrueba=r.estado==='prueba'?g('vp'):(r.vencePrueba||'');
  if(r.init){r.init.adminUser=un;if(g('adminPass'))r.init.adminPass=g('adminPass')}
  escribirDB(id,d);if(id===RES)ensureCuotas(),save();savePlat();closeSheet();render();toast('Residencial actualizada'+msgC)}

  sheet('Eliminar residencial',`<div class="alert bad"><b>Esta acción no se puede deshacer</b><p>Se borran ${st.casas} casas, ${st.usuarios} usuarios, pagos, accesos, avisos y reclamos de <b>${esc(r.nombre)}</b>. Nadie de esa residencial podrá volver a entrar.</p></div><p class="note">Si solo quieres bloquear el acceso por falta de pago, mejor cambia el estado a <b>Suspendida</b>.</p><label class="f">Escribe el nombre de la residencial para confirmar<input id="delConf" autocomplete="off" placeholder="${esc(r.nombre)}" oninput="document.getElementById('delBtn').disabled=this.value.trim().toLowerCase()!=='${esc(r.nombre.toLowerCase()).replace(/'/g,"\\'")}'"></label><button id="delBtn" class="btn bad block" disabled onclick="eliminarResOk('${id}')">Eliminar definitivamente</button><button class="btn ghost block" onclick="closeSheet()">Cancelar</button>`)}

const FRANJAS={manana:'Mañana (8–12)',tarde:'Tarde (1–5)',noche:'Noche (5–7)'};

const montoVisita=v=>sum(pendCasa(v.casaId).filter(c=>v.periodos.includes(c.periodo)),montoCuota);
function pedirCobro(cid){const pend=pendCasa(cid);if(!pend.length)return toast('No hay cuotas pendientes');if(DB.visitasCobro.some(v=>v.casaId===cid&&v.estado==='pendiente'))return toast('Ya hay un cobro a domicilio programado para esta casa');
  const pre=S.user.rol==='residente'&&S.sel&&S.sel.length?S.sel:pend.map(c=>c.periodo);const adm=S.user.rol==='admin';
  sheet('Cobro a domicilio · '+casaNom(cid),`<p class="note">El cobrador llega a la casa, recibe el pago y entrega el recibo físico o digital.</p><div class="card">${pend.map(c=>`<label class="chk"><input type="checkbox" name="per" value="${c.periodo}" ${pre.includes(c.periodo)?'checked':''}><span class="grow">${perL(c.periodo)} ${vencida(c)?chip('Vencido','bad'):''}</span><b>${money(montoCuota(c))}</b></label>`).join('')}</div>

function crearVisita(e,cid){e.preventDefault();const ps=perSel();if(!ps.length)return toast('Selecciona al menos un mes');const f=new FormData(e.target);
  const v={id:uid(),casaId:cid,periodos:ps,fecha:f.get('fecha'),franja:f.get('franja'),recibo:f.get('recibo'),nota:f.get('nota')||'',cobradorId:f.get('cob')||'',estado:'pendiente',solicitadoPor:S.user.id,creada:nowISO()};DB.visitasCobro.unshift(v);
  const txt=`${casaNom(cid)} · ${fFecha(v.fecha)} · ${FRANJAS[v.franja]} · ${ps.map(perC).join(', ')}`;
  notificar(v.cobradorId?[v.cobradorId]:cobradores().map(u=>u.id),'🧾 Nuevo cobro a domicilio',txt,{tab:'inicio'});
  if(S.user.rol==='admin')notificar(duenoIds(cid),'🧾 Cobro a domicilio programado',`El cobrador pasará el ${fFecha(v.fecha)} (${FRANJAS[v.franja]}).`,{tab:'pagos'});else notificar(admins(),'🧾 Solicitud de cobro a domicilio',txt,{tab:'cobros'});

async function guardarArchivo(nombre,data){try{const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(d){await d.save({filename:nombre,data});return}}catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable')return toast('No se pudo descargar: '+(e.message||e.code))}
  const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}

function importarCasas(){IMP=null;sheet('Subir casas desde archivo',`<p class="note" style="margin-top:0">Usa un Excel (.xlsx) o CSV con tres columnas: <b>Número de casa</b>, <b>Polígono</b> y <b>Apellidos de la familia</b> (opcional). La primera fila puede ser el encabezado.</p>
  <div class="card" style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%">${PLANT.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'} style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)">${esc(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table></div>
  <button class="btn ghost block" onclick="descargarPlantilla()">${ic('doc',18)} Descargar plantilla de Excel</button>
  <label class="f" style="margin-top:14px">Archivo de casas<input type="file" id="impFile" accept=".xlsx,.xls,.csv,.txt,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="leerImport(this.files[0])"></label>
  <details><summary class="sm" style="margin-bottom:8px">O pega las filas copiadas de Excel</summary><textarea id="impPaste" placeholder="1&#9;A&#9;Hernández López&#10;2&#9;A&#9;Martínez Ruiz"></textarea><button class="btn sec block" onclick="revisarPegado()">Revisar filas pegadas</button></details>
  <div id="impPrev"></div>`)}
function revisarPegado(){const t=document.getElementById('impPaste').value;if(!t.trim())return toast('Pega primero las filas');procesarFilas(textoAFilas(t))}
function textoAFilas(t){const ls=t.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());const sep=ls.some(l=>l.includes('\t'))?'\t':ls.some(l=>l.includes(';'))?';':',';return ls.map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,'').trim()))}
async function leerImport(f){if(!f)return;const prev=document.getElementById('impPrev');prev.innerHTML=empty('Leyendo archivo…');
  try{if(/\.(csv|txt)$/i.test(f.name)||f.type==='text/csv'){procesarFilas(textoAFilas(await f.text()));return}
    const X=await cargarXLSX();const wb=X.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];procesarFilas(X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.map(x=>String(x).trim())))}
  catch(e){prev.innerHTML=alertBox('bad','No se pudo leer el archivo','Revisa que sea .xlsx o .csv. Si estás sin internet, guarda el Excel como CSV o pega las filas.')}}
const normPol=p=>{p=String(p||'').trim();if(!p)return'';return /^pol/i.test(p)?p.replace(/^pol[ií]gono/i,'Polígono'):'Polígono '+p.toUpperCase()};
function procesarFilas(filas){filas=filas.filter(r=>r.some(c=>c));if(!filas.length){document.getElementById('impPrev').innerHTML=alertBox('bad','El archivo está vacío','');return}
  let ci={n:0,p:1,f:2};const h=filas[0].map(x=>x.toLowerCase());
  if(h.some(x=>/n[uú]mero|casa|pol[ií]gono|familia|apellido/.test(x))){const fx=re=>h.findIndex(x=>re.test(x));ci={n:fx(/n[uú]mero|^casa|^no\.?$|^#/),p:fx(/pol[ií]gono|pasaje|bloque|sector/),f:fx(/familia|apellido/)};if(ci.n<0)ci.n=0;filas=filas.slice(1)}
  const vistos=new Set();
  IMP=filas.map((r,i)=>{const numero=String(r[ci.n]??'').replace(/^casa\s*/i,'').trim(),pasaje=normPol(ci.p>=0?r[ci.p]:''),familia=ci.f>=0?String(r[ci.f]??'').trim():'';
    const k=numero+'|'+pasaje.toLowerCase();let est='nueva',msg='';
    if(!numero){est='error';msg='Falta el número'}else if(!pasaje){est='error';msg='Falta el polígono'}else if(vistos.has(k)){est='error';msg='Repetida en el archivo'}
    else{const ex=DB.casas.find(c=>c.numero===numero&&c.pasaje.toLowerCase()===pasaje.toLowerCase());if(ex){est=familia&&familia!==ex.familia?'actualiza':'existe';msg=est==='actualiza'?'Ya existe · se actualizan apellidos':'Ya existe'}}
    vistos.add(k);return{fila:i+1,numero,pasaje,familia,est,msg}});
  const c=k=>IMP.filter(x=>x.est===k).length;const EST={nueva:['Nueva','ok'],actualiza:['Actualiza','info'],existe:['Ya existe','mut'],error:['Error','bad']};
  document.getElementById('impPrev').innerHTML=`<h3>Revisión · ${IMP.length} fila(s)</h3><div class="months" style="margin-bottom:8px">${chip(c('nueva')+' nuevas','ok')}${c('actualiza')?chip(c('actualiza')+' actualizan apellidos','info'):''}${c('existe')?chip(c('existe')+' ya existen','mut'):''}${c('error')?chip(c('error')+' con error','bad'):''}</div>
  <div class="card" style="max-height:300px;overflow:auto;padding:4px 14px">${IMP.slice(0,300).map(x=>`<div class="chk"><span class="grow"><b>Casa ${esc(x.numero||'?')}</b> <span class="sm muted">· ${esc(x.pasaje||'sin polígono')}${x.familia?' · Fam. '+esc(x.familia):''}</span>${x.msg?`<div class="sm muted">Fila ${x.fila}: ${esc(x.msg)}</div>`:''}</span>${chip(EST[x.est][0],EST[x.est][1])}</div>`).join('')}</div>
  ${c('nueva')+c('actualiza')?`<button class="btn ok block big-ok" onclick="confirmarImport()">Importar ${c('nueva')} casa(s)${c('actualiza')?' y actualizar '+c('actualiza'):''}</button>`:alertBox('warn','No hay casas nuevas para importar','')}${c('error')?'<p class="note">Las filas con error no se importan. Corrígelas en el archivo y súbelo de nuevo.</p>':''}`}
function confirmarImport(){if(!IMP)return;const per=periodoActual();const desde=ymd()<=vence(per)?per:addMonths(per,1);let n=0,u=0;
  IMP.forEach(x=>{if(x.est==='nueva'){DB.casas.push({id:'c'+uid(),numero:x.numero,pasaje:x.pasaje,familia:x.familia,duenoId:null,codigo:genCodigo(),desde});n++}else if(x.est==='actualiza'){const ex=DB.casas.find(c=>c.numero===x.numero&&c.pasaje.toLowerCase()===x.pasaje.toLowerCase());if(ex){ex.familia=x.familia;u++}}});
  IMP=null;ensureCuotas();save();{const pr=PLAT.residenciales.find(r=>r.id===RES);if(pr)savePlat()}closeSheet();S.cf='todas';render();toast(`${n} casa(s) importadas${u?' · '+u+' actualizadas':''}. Cobro desde ${perL(desde)}.`)}

/* Configuración inicial de la plataforma */
function vSetup(){return `<div class="login"><div class="logo">${ic('houses',34)}</div><h1 style="margin:0 0 2px">Mi Residencial</h1><p class="muted" style="margin:0 0 18px">Configuración inicial</p>
<div class="card sm">Crea tu cuenta de <b>dueño de la app</b>. Con ella registras las residenciales, sus administradores y planes. Solo se pide una vez en este dispositivo.</div>
<form class="card" onsubmit="crearPlataforma(event)"><label class="f">Tu nombre<input name="nombre" required autocomplete="name"></label><label class="f">Usuario<input name="user" required autocapitalize="none" autocomplete="username" placeholder="Ej. miguel"></label>
<div class="two"><label class="f">Contraseña<input name="pass" type="password" required minlength="6" autocomplete="new-password"></label><label class="f">Repite la contraseña<input name="pass2" type="password" required minlength="6" autocomplete="new-password"></label></div>
<label class="chk" style="border:0"><input type="checkbox" name="demo" checked><span class="sm"><b>Cargar residenciales de ejemplo</b> para probar todos los roles (puedes eliminarlas después).</span></label>
<button class="btn block">Crear cuenta y entrar</button></form></div>`}
function crearPlataforma(e){e.preventDefault();const f=new FormData(e.target);const un=String(f.get('user')).trim().toLowerCase();
  if(f.get('pass')!==f.get('pass2'))return toast('Las contraseñas no coinciden');if(!/^[a-z0-9._-]{3,}$/.test(un))return toast('Usuario: mínimo 3 letras o números, sin espacios');
  if(PLAT.superadmins.some(x=>x.user===un))return toast('Ese usuario de dueño ya existe');
  const sa={id:'sa'+uid(),rol:'superadmin',nombre:String(f.get('nombre')).trim(),user:un,pass:f.get('pass'),activo:true};PLAT.superadmins.push(sa);savePlat();closeSheet();entrar(sa);toast('Usuario de dueño creado')}
function miCuentaSA(){const u=S.user;sheet('Mi cuenta de dueño',`<form onsubmit="guardarCuentaSA(event)"><label class="f">Nombre<input name="nombre" required value="${esc(u.nombre)}"></label><label class="f">Usuario<input name="user" required autocapitalize="none" value="${esc(u.user)}"></label><label class="f">Contraseña actual<input name="a" type="password" required></label><label class="f">Nueva contraseña (opcional)<input name="n" type="password" minlength="6"></label><button class="btn block">Guardar</button></form>`)}
function guardarCuentaSA(e){e.preventDefault();const f=new FormData(e.target);if(f.get('a')!==S.user.pass)return toast('La contraseña actual no es correcta');const un=String(f.get('user')).trim().toLowerCase();if(!/^[a-z0-9._-]{3,}$/.test(un))return toast('Usuario: mínimo 3 letras o números, sin espacios');
  S.user.nombre=String(f.get('nombre')).trim();S.user.user=un;if(f.get('n'))S.user.pass=f.get('n');savePlat();closeSheet();render();toast('Cuenta actualizada')}
const NIVELES=[['admin','Administración'],['residente','Residentes (propietarios)'],['inquilino','Inquilinos'],['vigilante','Vigilancia'],['cobrador','Cobradores']];
function usuariosNivel(r,d){return `<h3>Usuarios de la residencial</h3><p class="note" style="margin-top:-4px">Como dueño de la app puedes entrar como cualquiera de ellos para revisar o dar soporte.</p>${NIVELES.map(([k,l])=>{const us=d.usuarios.filter(u=>u.rol===k);return `<details class="card" ${k==='admin'?'open':''}><summary class="row" style="cursor:pointer"><b class="grow">${l}</b>${chip(us.filter(u=>u.activo).length+' activos',us.length?'ok':'mut')}</summary><div style="margin-top:6px">${us.map(u=>{const c=u.casaId&&d.casas.find(x=>x.id===u.casaId);return `<div class="chk"><span class="grow"><b>${esc(u.nombre)}</b><div class="sm muted">Usuario ${esc(u.user)}${c?' · Casa '+esc(c.numero)+' '+esc(c.pasaje):''}${u.activo?'':' · inactivo'}</div></span>${u.activo?`<button class="btn smb ghost" onclick="impersonar('${r.id}','${u.id}')">Entrar</button>`:''}</div>`}).join('')||empty('Sin usuarios')}</div></details>`}).join('')}`}
function nuevoAdminUser(){sheet('Nuevo usuario de administración',`<p class="note" style="margin-top:0">Tendrá acceso completo a la administración de esta residencial: casas, pagos, avisos, accesos y personal.</p><form onsubmit="crearUsuario(event,'admin')"><label class="f">Nombre<input name="nombre" required></label><label class="f">Cargo<select name="cargo">${Object.values(CARGOS).flat().filter(c=>c!=='Otro').map(c=>`<option>${c}</option>`).join('')}</select></label><div class="two"><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off"></label><label class="f">Teléfono<input name="tel" inputmode="tel"></label></div><div class="two"><label class="f">Usuario<input name="user" required autocapitalize="none"></label><label class="f">Contraseña<input name="pass" required minlength="4"></label></div><button class="btn block">Crear usuario</button></form>`)}
function crearDueno(cid){const c=casa(cid);sheet('Propietario de '+casaNom(cid),`<p class="note" style="margin-top:0">Crea el usuario del propietario si la administración ya verificó sus documentos. Si prefieres que se registre solo, entrégale el código de registro de la casa.</p><form onsubmit="guardarDueno(event,'${cid}')"><label class="f">Nombre completo<input name="nombre" required></label><label class="f">Apellidos de la familia<input name="familia" value="${esc(c.familia||'')}"></label><div class="two"><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off" required></label><label class="f">Teléfono<input name="tel" inputmode="tel"></label></div><label class="f">Correo<input name="email" type="email"></label><div class="two"><label class="f">Usuario<input name="user" required autocapitalize="none" value="casa${esc(c.numero)}"></label><label class="f">Contraseña<input name="pass" required minlength="4" value="${Math.random().toString(36).slice(2,8)}"></label></div><button class="btn block">Crear propietario</button></form>`)}
function guardarDueno(e,cid){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();const un=g('user').toLowerCase();
  if(!/^\d{8}-\d$/.test(g('dui')))return toast('DUI incompleto. Formato: 00000000-0');if(DB.usuarios.some(u=>u.user.toLowerCase()===un))return toast('Ese usuario ya existe, elige otro');
  const c=casa(cid);const u={id:'u_'+uid(),rol:'residente',nombre:g('nombre'),user:un,pass:g('pass'),casaId:cid,tel:g('tel'),email:g('email'),dui:g('dui'),activo:true};DB.usuarios.push(u);c.duenoId=u.id;if(g('familia'))c.familia=g('familia');c.codigo=genCodigo();save();render();
  sheet('Propietario creado',`<p>Entrega estos datos a <b>${esc(u.nombre)}</b>:</p><div class="card kv"><span>Residencial</span><b>${esc(DB.residencial.nombre)}</b><span>Usuario</span><b>${esc(un)}</b><span>Contraseña</span><b>${esc(u.pass)}</b></div><p class="note">Puede cambiar su contraseña en Más › Mi perfil.</p><button class="btn block" onclick="closeSheet()">Listo</button>`)}
/* ---------------- Arranque ---------------- */
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.name||!/(^|\.)dui$/.test(t.name))return;const d=t.value.replace(/\D/g,'').slice(0,9);t.value=d.length>8?d.slice(0,8)+'-'+d.slice(8):d});
loadPlat();if(PLAT)load();
(()=>{if(!PLAT)return;const ses=getSes()||'';const[r,id]=ses.split('|');if(!id)return;if(r==='plat'){const u=PLAT.superadmins.find(x=>x.id===id);if(u)S.user=u;return}if(PLAT.residenciales.some(x=>x.id===r)){load(r);const u=usuario(id);if(u&&!puedeEntrar(u))S.user=u}})();
render();
window.addEventListener('storage',e=>{if(e.key===PKEY){loadPlat()}else if(e.key===dbKey(RES)){try{DB=JSON.parse(e.newValue)||DB}catch(x){return}}else return;if(S.user&&S.user.rol!=='superadmin')S.user=usuario(S.user.id)||null;const a=document.activeElement;if(!a||!['INPUT','TEXTAREA','SELECT'].includes(a.tagName))render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
